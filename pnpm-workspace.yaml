packages:
  - 'packages/*'
  - 'libs/*'
  - 'tools/*'

allowBuilds:
  esbuild: true
  puppeteer: true

minimumReleaseAgeExclude:
  - '@inkdropapp/*'
  - inkdrop-model
  - oxlint
  - '@oxlint/*'
  - oxfmt
  - '@oxfmt/*'
  - '@nkzw/oxlint-config'
  - tsrs
  - '@tsrs/*'

catalog:
  '@codemirror/state': ^6.7.1
  '@inkdropapp/types': ^0.1.2
  '@types/node': ^26.6.5
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  '@vitest/coverage-v8': ^5.1.0
  inkdrop-model: ^2.13.1
  katex: ^0.19.0
  oxfmt: 0.79.0
  oxlint: 1.94.0
  pele: ^1.9.0
  react: ^19.3.1
  tsdown: ^0.23.1
  typescript: ^7.0.2
  vite: ^8.3.8
  vitest: ^5.1.0
